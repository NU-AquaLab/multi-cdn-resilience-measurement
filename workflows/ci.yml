name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Check shell launchers
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          for script in bash_*.sh scripts/*.sh; do bash -n "$script"; done
          shellcheck -x -P SCRIPTDIR bash_*.sh scripts/*.sh
      - name: Test
        run: python -m pytest
      - name: Build distributions
        run: python -m build
      - name: Check installed wheel outside the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          measure-tiktok --help
          python -c 'from measure_tiktok.config import load_live_categories; assert load_live_categories()'
